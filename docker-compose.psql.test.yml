name: ddon-test

volumes:
  ddon-server-psql-test-volume:

networks:
  ddon-network-test:

services:
  app:
    container_name: ddon-server-test
    user: "0:0"
    build:
      dockerfile: psql.Dockerfile
      context: .
      args:
        - RUNTIME=${RUNTIME:-linux-x64}
    restart: no
    ports:
      # Game server
      - "53000:53000"
      # Web server
      - "53099:53099"
      # Login server
      - "53100:53100"
    environment:
      - DB_TYPE=postgresql
      - DB_DATABASE=postgres
      - DB_FOLDER=/var/ddon/server/Files/Database
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_PORT=5432
      - DB_WIPE_ON_STARTUP=false
      - DB_BUFFER_SIZE=32768
      - DB_NO_RESET_ON_CLOSE=true
      - DB_ENABLE_TRACING=true
      - DB_ENABLE_POOLING=true
      - DB_MAX_AUTO_PREPARE=200
      - DDON_DISABLE_ASSET_WATCHERS=true
      - DDON_INTERNAL_RPC_HOST=127.0.0.1
    volumes:
      - ./Arrowgene.Ddon.config.psql.local_test.json:/var/ddon/server/Files/Arrowgene.Ddon.config.json:ro
      - ./Arrowgene.Ddon.Shared/Files/Assets:/var/ddon/server/Files/Assets
      - ./Arrowgene.Ddon.Shared/Files/Assets/GameServerList.test.csv:/var/ddon/server/Files/Assets/GameServerList.csv:ro
      - ./Arrowgene.Ddon.Scripts/scripts:/var/ddon/server/Files/Assets/scripts
    networks:
      - ddon-network-test
    depends_on:
      db:
        condition: service_healthy
    command: ["/var/ddon/server/Arrowgene.Ddon.Cli", "server", "start", "--service"]

  db:
    container_name: ddon-db-test
    image: postgres:17
    ports:
      # Database
      - "5433:5432"
    restart: no
    volumes:
      - ddon-server-psql-test-volume:/var/lib/postgresql/data
      - ./deploy/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - ddon-network-test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      - POSTGRES_INITDB_ARGS=--auth=scram-sha-256 --lc-numeric=en_US.UTF-8
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "postgres"]
      interval: 10s
      timeout: 1s
      retries: 3